name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  build:
    name: Test (Node ${{ matrix.node-version }}, React ${{ matrix.react-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.9.0", "22", "24"]
        react-version: ["18", "19"]

    env:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"

      - name: enable corepack
        run: |
          corepack enable
          corepack prepare yarn@4.11.0 --activate

      - name: cache yarn dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.yarn/cache
          key:
            ${{ runner.os }}-node${{ matrix.node-version }}-react${{ matrix.react-version
            }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node-version }}-react${{ matrix.react-version }}-yarn-

      # Pin matrix React + react-dom only -- keep @testing-library/react at the
      # repo-default v13.3 across every cell. RTL v13 was authored against
      # React 18 but works in practice on 17 (peer warning, no functional
      # break) and 19 (same), and crucially it does not change the render
      # bookkeeping the suite asserts on. Swapping to RTL v14/v16 alongside
      # React 18/19 surfaced a render-count drift in
      # createQuonfigHook-with-QuonfigProvider's "memoizes TypesafeClass"
      # test (10 -> 9 calls) that has nothing to do with the SDK's contract;
      # tracking that brittleness as a separate test-cleanup task.
      - name: Pin matrix React
        env:
          REACT_MAJOR: ${{ matrix.react-version }}
        run: |
          case "$REACT_MAJOR" in
            18) REACT_RANGE="^18.3.1" ;;
            19) REACT_RANGE="^19.1.1" ;;
            *) echo "Unknown REACT_MAJOR: $REACT_MAJOR"; exit 1 ;;
          esac
          export REACT_RANGE
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.devDependencies.react = process.env.REACT_RANGE;
            p.devDependencies['react-dom'] = process.env.REACT_RANGE;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Install modules
        run: yarn install --no-immutable

      - name: Run tests
        run: yarn test

      - name: Run formatter
        run: yarn prettier

      - name: Run Build
        run: yarn build

      - name: Check bundle size budget
        run: yarn size-limit

  # Lint is its own job, off the matrix: ESLint 10 declares
  # engines.node ^20.19.0 || ^22.13.0 || >=24, which the matrix's 20.9.0 floor
  # cell does not satisfy. That floor is deliberate -- it is the package's
  # published `engines` requirement and the test matrix must keep proving the
  # SDK runs there. ESLint is a devDependency only, so nothing about what we
  # publish changes; the linter just runs on a modern Node (matching
  # .tool-versions) while tests keep covering 20.9.0/22/24 x React 18/19.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    env:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: enable corepack
        run: |
          corepack enable
          corepack prepare yarn@4.11.0 --activate

      - name: cache yarn dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.yarn/cache
          key: ${{ runner.os }}-lint-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-lint-yarn-

      - name: Install modules
        run: yarn install --immutable

      - name: Run lints
        run: yarn lint
